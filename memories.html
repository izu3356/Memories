
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    text-align: center;
    font-family: Georgia, serif;
    color: #84394f;
    background: linear-gradient(135deg, #ffe5eb, #f8d4df);
}

h1 {
    font-size: 36px;
    margin-top: 35px;
}

.subtitle {
    font-style: italic;
    margin-bottom: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    max-width: 600px;
    margin: auto;
}

.memory {
    background: rgba(255,255,255,0.85);
    padding: 9px;
    border-radius: 12px;
    border: 1px solid #e8b9c5;
}

.memory img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 9px;
}

.memory p {
    font-size: 15px;
    margin: 10px 0;
}

.back {
    display: inline-block;
    margin: 35px 0;
    padding: 14px 30px;
    background: white;
    color: #84394f;
    text-decoration: none;
    border-radius: 8px;
    border: 1px solid #e8b9c5;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>♡ Our Memories ♡</h1>
<p class="subtitle">Every picture tells a story.</p>

<div class="gallery">

    <div class="memory">
        <img src="photo1.jpg">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo2.jpg" alt="Memory 2">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo3.jpg" alt="Memory 3">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo4.jpg" alt="Memory 4">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo5.jpg" alt="Memory 5">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo6.jpg" alt="Memory 6">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo7.jpg" alt="Memory 7">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo8.jpg" alt="Memory 8">
        <p>♡</p>
    </div>

    <div class="memory">
        <img src="images/photo9.jpg" alt="Memory 9">
        <p>♡</p>
    </div>

</div>

<a href="index.html" class="back">← Back to Home</a>

</body>
</html>
